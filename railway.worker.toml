[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Deploy the web service and its schema migration successfully before this service.
startCommand = "node --import tsx scripts/worker.ts"
sleepApplication = false
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
overlapSeconds = 0
drainingSeconds = 180
